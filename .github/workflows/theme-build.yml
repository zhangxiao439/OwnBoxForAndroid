name: Theme Port Build (Self-Signed)

# 在 fork 上独立构建，不依赖任何仓库 secrets：
# 自动生成临时 keystore 完成签名，产出可安装的 APK。
on:
  push:
    branches:
      - main
      - feature/throne-theme
  workflow_dispatch:
    inputs:
      abi:
        description: "ABI 过滤：arm64-v8a / armeabi-v7a / x86 / x86_64 / all"
        required: false
        default: "arm64-v8a"

permissions:
  contents: read

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25
      - name: Ensure NDK
        run: |
          if [ ! -f "${ANDROID_HOME}/ndk/25.0.8775105/source.properties" ]; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "ndk;25.0.8775105" || true
          fi
          ls -d "${ANDROID_HOME}"/ndk/* 2>/dev/null || true
      - name: Go Module Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('libcore/go.sum') }}
      - name: Native Build
        run: ./run lib core
      - name: Verify LibCore AAR
        run: |
          test -s app/libs/libcore.aar
          unzip -p app/libs/libcore.aar classes.jar > /tmp/libcore-classes.jar
          unzip -l /tmp/libcore-classes.jar | grep -q 'libcore/Libcore.class'
          unzip -l /tmp/libcore-classes.jar | grep -q 'go/Seq.class'
      - name: Upload LibCore AAR
        uses: actions/upload-artifact@v4
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.1" "ndk;25.0.8775105" || true
      - name: Download LibCore AAR
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs
      - name: Generate temporary keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias ownbox \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ownboxtemp -keypass ownboxtemp \
            -dname "CN=OwnBox, OU=Dev, O=OwnBox, L=NA, ST=NA, C=CN"
          keytool -list -keystore release.keystore -storepass ownboxtemp
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-theme-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          # assets.sh 的 get_latest_release 会调用 GitHub API 兜底；
          # 未认证时共享 runner IP 极易 403，导致版本号为空并退到不稳定的
          # releases/latest/download 路径。注入 token 使 API 可靠。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          echo "KEYSTORE_PASS=ownboxtemp" >> local.properties
          echo "ALIAS_NAME=ownbox" >> local.properties
          echo "ALIAS_PASS=ownboxtemp" >> local.properties

          ./run init action gradle
          # 默认只出 arm64-v8a（push 触发时 inputs 为空）；手动触发可传 abi=all 出全量
          ABI="${{ inputs.abi }}"
          [ -z "$ABI" ] && ABI="arm64-v8a"
          if [ "$ABI" = "all" ]; then
            ./gradlew app:assemblePreviewRelease
          else
            ./gradlew app:assemblePreviewRelease -Pandroid.injected.build.abi="$ABI"
          fi

          # 定位产物：注入 abi 时会改变输出目录结构（apk/preview/release →
          # apk/previewRelease 等），用全树查找兜底
          APK=$(find app/build/outputs -name '*.apk' 2>/dev/null | grep -v intermediates | head -n 1)
          if [ -n "$APK" ]; then
            APK_DIR=$(dirname "$APK")
          else
            APK_DIR="app/build/outputs/apk/preview/release"
          fi
          echo "APK dir: $APK_DIR"
          ls -la "$APK_DIR" || true

          APKSIGNER=$(find ${ANDROID_HOME}/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
          [ -z "$APKSIGNER" ] && APKSIGNER=$(command -v apksigner || true)
          echo "Using apksigner: ${APKSIGNER:-none}"

          if [ -n "$APKSIGNER" ]; then
            # 若 Gradle 未签名（产物带 -unsigned），用临时 keystore 补签
            for apk in "$APK_DIR"/*-unsigned.apk; do
              if [ -f "$apk" ]; then
                signed_apk="${apk%-unsigned.apk}-signed.apk"
                echo "Signing $apk -> $signed_apk"
                "$APKSIGNER" sign --ks release.keystore --ks-pass pass:ownboxtemp \
                  --key-pass pass:ownboxtemp --ks-key-alias ownbox \
                  --out "$signed_apk" "$apk"
                rm "$apk"
              fi
            done

            for apk in "$APK_DIR"/*.apk; do
              if [ -f "$apk" ]; then
                echo "Verifying $apk..."
                "$APKSIGNER" verify --verbose "$apk" || {
                  echo "::error::Signature verification failed for $apk"
                  exit 1
                }
              fi
            done
          else
            echo "::warning::apksigner not available, skipping signature verification"
          fi

          rm -f release.keystore
          echo "APK=$APK_DIR" >> $GITHUB_ENV

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: ${{ env.APK }}
